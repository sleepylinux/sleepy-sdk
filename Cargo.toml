[package]
name = "sleepy-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Versioned public document contracts for Sleepy Linux"

[lib]
name = "sleepy_sdk"
path = "src/lib.rs"

[[bin]]
name = "sleepy-contract"
path = "src/bin/sleepy-contract.rs"

[dependencies]
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = "1.0"
